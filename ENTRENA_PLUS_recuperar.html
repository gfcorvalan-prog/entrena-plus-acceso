<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENTRENA+ · Recuperar acceso</title><style>body{font:16px system-ui;background:#10191d;color:#f6faf8;margin:0;padding:24px}main{max-width:460px;margin:50px auto;background:#1b292e;border:1px solid #34474d;border-radius:18px;padding:24px}h1{color:#b5f477}label{display:block;margin:16px 0 6px}input{width:100%;box-sizing:border-box;background:#10191d;color:white;padding:13px;border:1px solid #53666c;border-radius:10px}button{margin-top:20px;background:#b5f477;color:#10191d;border:0;padding:13px;border-radius:10px;font-weight:700;width:100%}button:disabled{opacity:.5}#msg{line-height:1.5;color:#c7d8db}</style></head><body><main><h1>ENTRENA+</h1><h2>Crear una nueva contraseña</h2><p id="msg" role="status">Comprobando el enlace de recuperación…</p><form id="form" hidden><label for="p1">Nueva contraseña (mínimo 12 caracteres)</label><input id="p1" type="password" autocomplete="new-password" minlength="12" required><label for="p2">Repetir contraseña</label><input id="p2" type="password" autocomplete="new-password" minlength="12" required><button id="save" type="submit">Guardar nueva contraseña</button></form><p style="font-size:13px;color:#a9b9bc">Usá únicamente el enlace de recuperación enviado a tu correo. Nunca compartas ese enlace ni tu contraseña.</p></main><script>
const BASE='https://wnzqveoqefffzmykessx.supabase.co';
const KEY='sb_publishable_G03zi91S4Ag0BxHHL88uTQ_0ieyoMCy';
const msg=document.getElementById('msg'),form=document.getElementById('form');
let token=null;
(async()=>{const hash=new URLSearchParams(location.hash.slice(1)),query=new URLSearchParams(location.search);if(hash.get('error')){msg.textContent='El enlace no es válido: '+(hash.get('error_description')||hash.get('error'));return}
 token=hash.get('access_token');
 if(!token && query.get('token_hash')){try{const r=await fetch(BASE+'/auth/v1/verify',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({token_hash:query.get('token_hash'),type:'recovery'})});const b=await r.json();if(!r.ok)throw Error(b.msg||b.error_description||b.message||'Enlace inválido');token=b.access_token}catch(e){msg.textContent='No se pudo verificar el enlace: '+e.message;return}}
 if(!token){msg.textContent='Abrí esta página desde el enlace nuevo de recuperación que llegue a tu correo. Si llegaste directamente, todavía no hay un enlace válido.';return}
 history.replaceState(null,'',location.pathname);msg.textContent='Enlace verificado. Elegí tu nueva contraseña.';form.hidden=false;
})();
form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b){msg.textContent='Las contraseñas no coinciden.';return}if(a.length<12){msg.textContent='Usá al menos 12 caracteres.';return}const btn=document.getElementById('save');btn.disabled=true;msg.textContent='Guardando…';try{const r=await fetch(BASE+'/auth/v1/user',{method:'PUT',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({password:a})});const data=await r.json();if(!r.ok)throw Error(data.msg||data.error_description||data.message||'Error al guardar');msg.textContent='¡Contraseña actualizada! Ya podés volver a ENTRENA+ V4 e ingresar con la nueva contraseña.';form.hidden=true;token=null}catch(err){msg.textContent='No se pudo actualizar: '+err.message}finally{btn.disabled=false}});
</script></body></html>
